<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── PWA ─────────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1B2E5E" />

    <!-- ── SEO / descrição ─────────────────────────────────────── -->
    <title>TT Store</title>
    <meta name="description" content="Sistema de gestão da TT Store — estoque, vendas e caixa" />
    <meta name="application-name" content="TT Store" />

    <!-- ── iOS (Safari / iPhone) ───────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TT Store" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ── Ícone padrão ────────────────────────────────────────── -->
    <link rel="icon" type="image/png" href="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ── Registro do Service Worker (PWA) ────────────────────── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[PWA] Service Worker registrado:', reg.scope))
            .catch(err => console.warn('[PWA] Falha ao registrar SW:', err));
        });
      }
    </script>
  </body>
</html>
